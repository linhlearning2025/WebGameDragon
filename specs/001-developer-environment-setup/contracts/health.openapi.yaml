openapi: 3.1.0
info:
  title: Dragon English Kids Health API
  version: 1.0.0
  description: Process liveness and database readiness checks.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        '200':
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: live
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the API can use PostgreSQL
      responses:
        '200':
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: ready
                checks:
                  database: ready
        '503':
          description: PostgreSQL is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: not_ready
                checks:
                  database: unavailable
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: live
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [ready, unavailable]